# Azure App Service deployment for the SAMePOS Web App.
#
# HISTORY / WHY THIS LOOKS DIFFERENT FROM THE PORTAL DEFAULT
# ----------------------------------------------------------
# This file was generated by the Azure App Service portal wizard, which assumed
# an ASP.NET Core project. This repository has never contained one: no .csproj,
# .sln or .cs file exists in any commit on any branch. It is a Python project
# (a Sema4.ai action package) plus SQL migrations, shell and PowerShell.
#
# The generated workflow therefore failed on every single run from the day it
# was added -- it died at "Set up .NET Core" because 'dotnet10.x' is not a valid
# version spec, and fixing that would only have moved the failure to
# "dotnet build", which had no project to build.
#
# The .NET steps are gone. What replaces them is a build/validate job that
# exercises what this repository actually is, and the Azure deploy the wizard
# wired up, kept but gated (see DEPLOY IS GATED below).
#
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy the SAMePOS Azure Web App

# Manual dispatch only, deliberately.
#
# The portal default ran this on every push to main and pushed straight to the
# Production slot with no approval step. Even once the build works, an
# unreviewed auto-deploy to production on every merge is not what you want
# here; promote deliberately instead.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: >-
          Deploy to the Azure Web App after a successful build. Leave false to
          build and validate only. See DEPLOY IS GATED in this file before
          setting true.
        type: boolean
        default: false
        required: false

# One deploy to the Production slot at a time; overlapping runs can race and
# leave the slot in an indeterminate state. Builds are not cancelled in
# progress, so a queued promote still reflects the commit it was started for.
concurrency:
  group: samepos-azure-webapp
  cancel-in-progress: false

env:
  # requirements.txt pins sema4ai-action-server>=3.2.0, which requires Python
  # >=3.12. On 3.11 the install fails outright with "No matching distribution
  # found" -- so this floor is load-bearing, not a preference.
  PYTHON_VERSION: '3.12'

jobs:
  build:
    name: Build and validate
    # ubuntu, not windows-latest: the portal chose Windows for the .NET build.
    # This is a Python package, and Linux runners are faster and cheaper.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify the action package imports
        # A dependency resolution that "succeeds" but leaves the package
        # unimportable is the failure mode worth catching before a deploy.
        run: |
          python -c "import sema4ai.actions; print('sema4ai.actions OK')"
          python -c "import anthropic; print('anthropic OK')"

      - name: Package the source for App Service
        # App Service builds Python apps from source with Oryx, so what gets
        # deployed is the repository, not a compiled artifact. Excludes keep
        # local venvs, caches and git metadata out of the package.
        run: |
          zip -r samepos-app.zip . \
            -x '*.git/*' \
            -x '*.venv/*' \
            -x '*venv/*' \
            -x '*__pycache__/*' \
            -x '*.pytest_cache/*' \
            -x '*.zip'
          ls -lh samepos-app.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: samepos-app
          path: samepos-app.zip
          retention-days: 7

  # DEPLOY IS GATED
  # ---------------
  # This job only runs when the workflow is dispatched with deploy=true, and it
  # has NOT been verified end to end -- there is no way to exercise an Azure
  # deployment from CI without doing it for real. Before the first true run,
  # confirm all four of these:
  #
  #   1. OIDC federated credentials exist on the app registration for this repo
  #      (the secrets below are client/tenant/subscription IDs, not a password,
  #      so azure/login relies on a federated credential matching this repo and
  #      ref -- a dispatch from a non-main ref will not match a main-only one).
  #   2. The App Service OS and runtime are Linux + Python 3.12. The Web App was
  #      created by a wizard that believed this was an ASP.NET app, so its
  #      runtime stack may still be set to .NET.
  #   3. SCM_DO_BUILD_DURING_DEPLOYMENT=true is set in the app settings,
  #      otherwise Oryx will not install requirements.txt and the app starts
  #      with no dependencies.
  #   4. A startup command is configured. The action server does not start from
  #      a bare `python app.py`; it needs its own launch command bound to
  #      0.0.0.0 and $PORT. Set it in the App Service configuration rather than
  #      here, so it can be corrected without a code change.
  deploy:
    name: Deploy to Azure Web App
    # Both representations are checked on purpose. A typed boolean input arrives
    # in the `inputs` context as a real boolean, but the same value read as a
    # string elsewhere in Actions ('github.event.inputs.deploy') is "true"/
    # "false" -- and in GitHub expressions a non-empty string is truthy, so a
    # bare truthiness check on the string form would deploy even when the box
    # was left unticked. GitHub's loose equality also will not equate the string
    # "true" with boolean true, so neither comparison alone covers both. The
    # failure mode being guarded against is an unintended production deploy.
    if: ${{ inputs.deploy == true || inputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      # Lets branch/reviewer protection rules apply to the promote, if the
      # repository defines a "Production" environment.
      name: Production
    permissions:
      id-token: write # required for requesting the OIDC JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: samepos-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B4687A5773C64DB1B0EABF25265A97F7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_66C769589125423EA4E4292AD73914E5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B2882B79E3BB460992B4EFA4594B59AA }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'SAMePOS'
          slot-name: 'Production'
          # The explicit zip, rather than the portal default of '.', which
          # depended on the artifact happening to land in the working directory.
          package: samepos-app.zip
