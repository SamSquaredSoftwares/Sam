name: CI

# push is restricted to main so a branch with an open pull request is not built
# twice for the same commit (once for push, once for pull_request). Branch commits
# are covered by the pull_request trigger; main is covered post-merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The action package's own suite. Until this job existed nothing ran these
  # tests automatically: the Azure workflow never ran tests and driver-tests
  # below only covers tools/samepos-node. That gap is how an httpx -> httpx2
  # break in the Anthropic SDK sat on main unnoticed.
  repo-tests:
    name: Action package tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # A failure on one interpreter must not hide the other's result - the
      # 3.13 strict-TLS regression was only visible because 3.12 stayed green.
      fail-fast: false
      matrix:
        # 3.12 is the floor: requirements.txt pins sema4ai-action-server>=3.2.0,
        # which requires >=3.12 (on 3.11 pip fails to resolve it at all). 3.13
        # is the ceiling that package supports (<3.14) and is where
        # create_default_context() turns on VERIFY_X509_STRICT, so it is the
        # interpreter that catches non-RFC-5280 certificate handling.
        python-version: ['3.12', '3.13']
    env:
      # The TLS tests skip themselves when cryptography is missing, so a
      # developer without native wheels can still run the rest. In CI that
      # would turn green while the handshake tests silently never ran; this
      # switch, which the suite itself defines, makes such a skip a failure.
      SAM_TESTS_REQUIRE_TLS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the action package tests
        run: pytest tests/ -q

  driver-tests:
    name: SAMePOS driver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pywinrm impacket pytest

      - name: Run driver tests
        run: pytest tools/samepos-node/tests -q

      # The SMB tests stand up a real impacket server on a loopback port and
      # drive the actual wire protocol. They skip themselves if the server
      # cannot bind, which keeps a developer's machine usable but would turn CI
      # green while testing nothing -- so here a skip is a failure.
      - name: SMB integration tests must actually run, not skip
        run: |
          set -o pipefail
          pytest tools/samepos-node/tests/test_smb_integration.py -q -rs \
            | tee /tmp/smb-integration.log
          if grep -qiE '[0-9]+ skipped|SKIPPED' /tmp/smb-integration.log; then
            echo "::error::SMB integration tests skipped - the real-protocol path was not exercised"
            exit 1
          fi

      # Every phase script is shipped to a live trading venue and run there, so a
      # syntax error costs a round trip against a real POS box. pwsh is
      # preinstalled on ubuntu runners; this parses without executing.
      - name: Parse-check PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter *.ps1 -Recurse -File | ForEach-Object {
            $errors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref] $tokens, [ref] $errors)
            if ($errors) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Host "ok: $($_.FullName)"
            }
          }
          if ($failed) { exit 1 }
